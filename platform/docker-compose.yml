services:
  postgres:
    image: postgres:15-alpine
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portalpassword
      POSTGRES_DB: portaldb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  portal-backend:
    build: 
      context: ../portal/backend
    container_name: portal-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://portal:portalpassword@postgres:5432/portaldb
    depends_on:
      - postgres

  caddy:
    image: caddy:alpine
    container_name: games-caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./registry:/srv/registry:ro
      - ./sdk:/srv/sdk:ro
      - caddy_data:/data
      - caddy_config:/config

  portal-frontend:
    build:
      context: ../portal/frontend
    container_name: portal-frontend
    restart: unless-stopped
    depends_on:
      - portal-backend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
